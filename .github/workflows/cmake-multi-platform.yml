# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
#
# NOTE: Windows / MSVC (`cl`) and Clang are intentionally not part of the
# matrix because neither implements C++26 reflection, which Baldr relies on.
# Windows builds use the MinGW-w64 GCC 16.2 toolchain from niXman/mingw-builds-binaries.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - zensical.toml
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            cc: gcc
            cxx: g++
          - os: windows-latest
            c_compiler: 'C:/mingw64-gcc16/bin/gcc.exe'
            cpp_compiler: 'C:/mingw64-gcc16/bin/g++.exe'
            cc: 'C:/mingw64-gcc16/bin/gcc.exe'
            cxx: 'C:/mingw64-gcc16/bin/g++.exe'

    steps:
    - uses: actions/checkout@v4

    - name: Cache GCC 16.2 debs on Linux
      if: matrix.os == 'ubuntu-latest'
      id: cache-gcc-debs
      uses: actions/cache@v4
      with:
        path: ~/gcc-16-debs
        key: gcc-16-debs-16.2.0-1ubuntu1-amd64

    - name: Install GCC 16.2 on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        set -euo pipefail
        VER=16.2.0-1ubuntu1
        BASE=https://archive.ubuntu.com/ubuntu/pool/universe/g/gcc-16
        CACHE_DIR="$HOME/gcc-16-debs"
        mkdir -p "$CACHE_DIR"
        pkgs=(
          gcc-16-base_${VER}_amd64.deb
          libgcc-16-dev_${VER}_amd64.deb
          cpp-16-x86-64-linux-gnu_${VER}_amd64.deb
          cpp-16_${VER}_amd64.deb
          gcc-16-x86-64-linux-gnu_${VER}_amd64.deb
          gcc-16_${VER}_amd64.deb
          libstdc++-16-dev_${VER}_amd64.deb
          g++-16-x86-64-linux-gnu_${VER}_amd64.deb
          g++-16_${VER}_amd64.deb
        )
        if [ "${{ steps.cache-gcc-debs.outputs.cache-hit }}" != "true" ]; then
          for pkg in "${pkgs[@]}"; do
            curl -fsSL "$BASE/$pkg" -o "$CACHE_DIR/$pkg"
          done
        fi
        sudo apt-get update
        sudo apt-get install -y "$CACHE_DIR"/*.deb
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
          --slave /usr/bin/g++ g++ /usr/bin/g++-16 \
          --slave /usr/bin/gcov gcov /usr/bin/gcov-16
        sudo update-alternatives --set gcc /usr/bin/gcc-16
        gcc --version
        g++ --version
        gcc --version | grep -E '16\.2'
        g++ --version | grep -E '16\.2'

    - name: Cache MinGW-w64 GCC 16.2 on Windows
      if: matrix.os == 'windows-latest'
      id: cache-mingw
      uses: actions/cache@v4
      with:
        path: C:\mingw64-gcc16
        key: mingw64-gcc16-16.2.0-rt_v14-rev1-posix-seh-ucrt

    - name: Install MinGW-w64 GCC 16.2 (niXman mingw-builds) on Windows
      if: matrix.os == 'windows-latest' && steps.cache-mingw.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-posix-seh-ucrt-rt_v14-rev1.7z'
        $zip = "$env:TEMP\mingw64.7z"
        $scratch = 'C:\mingw64-scratch'
        $toolchain = 'C:\mingw64-gcc16'
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
        Write-Host "Extracting toolchain to $scratch"
        if (Test-Path $scratch) { Remove-Item -Recurse -Force $scratch }
        New-Item -ItemType Directory -Path $scratch | Out-Null
        # Use forward-slash style output path; 7z requires the trailing slash to
        # treat it as a directory rather than a prefix.
        & 7z.exe x $zip "-o${scratch}\" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }
        Write-Host 'Contents of scratch directory:'
        Get-ChildItem -Path $scratch -Force | Select-Object Name, FullName | Format-Table -AutoSize | Out-String | Write-Host
        # The archive's top-level folder is the build name; rename it to a stable path.
        $extracted = Get-ChildItem -Path $scratch -Directory |
          Select-Object -First 1
        if (-not $extracted) { throw "No directory found under $scratch after 7z extraction" }
        if (Test-Path $toolchain) { Remove-Item -Recurse -Force $toolchain }
        Rename-Item -Path $extracted.FullName -NewName 'mingw64-gcc16'
        # `Rename-Item` moves into the parent (i.e. $scratch), so move it up to C:\.
        Move-Item -Path (Join-Path $scratch 'mingw64-gcc16') -Destination $toolchain -Force
        Remove-Item -Recurse -Force $scratch
        $gcc = Join-Path $toolchain 'bin\gcc.exe'
        if (-not (Test-Path $gcc)) { throw "gcc.exe not found at $gcc" }
        & $gcc --version

    - name: Prepend MinGW GCC 16.2 to PATH on Windows
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $toolchain = 'C:\mingw64-gcc16'
        $gcc = Join-Path $toolchain 'bin\gcc.exe'
        if (-not (Test-Path $gcc)) { throw "gcc.exe not found at $gcc" }
        # Strip any preinstalled mingw64/msys64 entries from machine PATH so our
        # GCC 16.2 wins, and prepend our toolchain.
        $sysPath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
        $newSysPath = ($sysPath -split ';' | Where-Object { $_ -and ($_ -notmatch 'mingw64') -and ($_ -notmatch 'msys64') }) -join ';'
        $newSysPath = "$toolchain\bin;$newSysPath"
        [Environment]::SetEnvironmentVariable('Path', $newSysPath, 'Machine')
        $env:Path = $newSysPath
        & $gcc --version
        & (Join-Path $toolchain 'bin\g++.exe') --version

    # Install/restore ccache after the toolchain is on PATH so compiler identity is stable.
    # CMakeLists.txt already wires CMAKE_*_COMPILER_LAUNCHER when ccache is found.
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.cc }}
        restore-keys: |
          ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.cc }}
          ${{ matrix.os }}-${{ matrix.build_type }}-
        max-size: 2G
        verbose: 1
        evict-old-files: job

    # Stable key (CMake files only): source edits reuse the same entry so Ninja can
    # incremental-build; ccache covers compile reuse when the build tree is cold.
    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ matrix.cc }}-${{ matrix.build_type }}-Ninja-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.cc }}-${{ matrix.build_type }}-Ninja-

    - name: Configure CMake
      shell: bash
      run: >
        cmake -B "build"
        -G "Ninja"
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DFREYR_BUILD_TESTS=ON
        -DFREYR_PROFILING=OFF
        -DFREYR_BUILD_BENCHMARKS=OFF
        -DFREYR_BUILD_EXAMPLES=OFF
        -S "${{ github.workspace }}"

    - name: Build
      shell: bash
      run: |
        export PATH="/c/mingw64-gcc16/bin:$PATH"
        cmake --build "build" --config ${{ matrix.build_type }}

    - name: Test
      shell: bash
      working-directory: build
      run: |
        export PATH="/c/mingw64-gcc16/bin:$PATH"
        ctest --rerun-failed --output-on-failure --build-config ${{ matrix.build_type }}

  coverage:
    name: Coverage (Linux GCC)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache GCC 16.2 debs
      id: cache-gcc-debs
      uses: actions/cache@v4
      with:
        path: ~/gcc-16-debs
        key: gcc-16-debs-16.2.0-1ubuntu1-amd64

    - name: Install GCC 16.2
      run: |
        set -euo pipefail
        VER=16.2.0-1ubuntu1
        BASE=https://archive.ubuntu.com/ubuntu/pool/universe/g/gcc-16
        CACHE_DIR="$HOME/gcc-16-debs"
        mkdir -p "$CACHE_DIR"
        pkgs=(
          gcc-16-base_${VER}_amd64.deb
          libgcc-16-dev_${VER}_amd64.deb
          cpp-16-x86-64-linux-gnu_${VER}_amd64.deb
          cpp-16_${VER}_amd64.deb
          gcc-16-x86-64-linux-gnu_${VER}_amd64.deb
          gcc-16_${VER}_amd64.deb
          libstdc++-16-dev_${VER}_amd64.deb
          g++-16-x86-64-linux-gnu_${VER}_amd64.deb
          g++-16_${VER}_amd64.deb
        )
        if [ "${{ steps.cache-gcc-debs.outputs.cache-hit }}" != "true" ]; then
          for pkg in "${pkgs[@]}"; do
            curl -fsSL "$BASE/$pkg" -o "$CACHE_DIR/$pkg"
          done
        fi
        sudo apt-get update
        sudo apt-get install -y "$CACHE_DIR"/*.deb
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
          --slave /usr/bin/g++ g++ /usr/bin/g++-16 \
          --slave /usr/bin/gcov gcov /usr/bin/gcov-16
        sudo update-alternatives --set gcc /usr/bin/gcc-16
        gcc --version
        g++ --version
        gcov --version
        gcc --version | grep -E '16\.2'
        g++ --version | grep -E '16\.2'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: coverage-linux-gcc-Debug
        restore-keys: |
          coverage-linux-gcc-
        max-size: 2G
        verbose: 1
        evict-old-files: job

    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: build
        key: coverage-linux-gcc-Debug-Ninja-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
        restore-keys: |
          coverage-linux-gcc-Debug-Ninja-

    - name: Install gcovr
      run: pipx install gcovr

    - name: Configure CMake (Debug + coverage)
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_BUILD_TYPE=Debug
        -DFREYR_BUILD_TESTS=ON
        -DFREYR_COVERAGE=ON
        -DFREYR_PROFILING=OFF
        -DFREYR_BUILD_BENCHMARKS=OFF
        -DFREYR_BUILD_EXAMPLES=OFF
        -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build build --config Debug

    - name: Generate coverage reports
      run: bash ./gcovr.sh
      env:
        BUILD_DIR: build

    - name: Upload coverage HTML artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/
        if-no-files-found: error

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-report/cobertura.xml,coverage-report/coverage.lcov
        flags: unittests
        name: freyr-linux-gcc
        fail_ci_if_error: true
        verbose: true
