# Shared gcovr settings for Freyr product code.
# Configure with: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFREYR_COVERAGE=ON -DFREYR_PROFILING=OFF
# then rebuild, run tests, and invoke ./gcovr.sh (or gcovr.ps1).

filter = src/
filter = include/

exclude = .*MPMCQueue\.hpp$
exclude = .*Processor\.hpp$
exclude = .*Profiling\.hpp$
exclude = .*perfetto.*

exclude-throw-branches = yes
exclude-unreachable-branches = yes
merge-lines = yes

gcov-ignore-parse-errors = all

html-nested = coverage-report/coverage.html
cobertura = coverage-report/cobertura.xml
lcov = coverage-report/coverage.lcov
