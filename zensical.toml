[project]
site_name = "Freyr"
site_description = "A high-performance, multithreaded Entity-Component-System (ECS) library for C++23, designed for real-time simulations and games."
site_url = "https://gilmar-sales.github.io/Freyr"
repo_url = "https://github.com/gilmar-sales/Freyr"
repo_name = "gilmar-sales/Freyr"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Gilmar Sales"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
  ] },
  { "Concepts" = [
    { "ECS Overview" = "concepts/ecs-overview.md" },
    { "Architecture" = "concepts/architecture.md" },
    { "Memory Layout" = "concepts/memory-layout.md" },
  ] },
  { "API Reference" = [
    { "Extension & Bootstrap" = "api/extension.md" },
    { "Options Builder" = "api/options-builder.md" },
    { "Pipeline Builder" = "api/pipeline-builder.md" },
    { "Scene" = "api/scene.md" },
    { "Components" = "api/components.md" },
    { "Systems" = "api/systems.md" },
    { "Events" = "api/events.md" },
    { "Mutation" = "api/mutation.md" },
    { "Query" = "api/query.md" },
    { "Archetype Builder" = "api/archetype-builder.md" },
  ] },
  { "Guides" = [
    { "Parallel Processing" = "guides/parallel-processing.md" },
    { "Profiling with Perfetto" = "guides/profiling.md" },
    { "Performance Tuning" = "guides/performance-tuning.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "search.highlight",
  "search.suggest",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.code.select",
  "content.tabs.link",
  "content.action.edit",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "material/puzzle-edit"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "light blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "light blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/gilmar-sales/Freyr"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
