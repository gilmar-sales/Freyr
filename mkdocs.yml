site_name: Freyr
site_description: A high-performance, multithreaded Entity-Component-System (ECS) library for C++23, designed for real-time simulations and games.
site_url: https://gilmar-sales.github.io/Freyr
repo_url: https://github.com/gilmar-sales/Freyr
repo_name: gilmar-sales/Freyr
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Gilmar Sales

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/puzzle-edit
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gilmar-sales/Freyr
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - footnotes

plugins:
  - search
  - mermaid2
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - Concepts:
      - ECS Overview: concepts/ecs-overview.md
      - Architecture: concepts/architecture.md
      - Memory Layout: concepts/memory-layout.md
  - API Reference:
      - Extension & Bootstrap: api/extension.md
      - Options Builder: api/options-builder.md
      - Pipeline Builder: api/pipeline-builder.md
      - Scene: api/scene.md
      - Components: api/components.md
      - Systems: api/systems.md
      - Events: api/events.md
      - Mutation: api/mutation.md
      - Query: api/query.md
      - Archetype Builder: api/archetype-builder.md
  - Guides:
      - Parallel Processing: guides/parallel-processing.md
      - Profiling with Perfetto: guides/profiling.md
      - Performance Tuning: guides/performance-tuning.md
